# Load from nginx's http context (e.g. /etc/nginx/conf.d/echo.conf).
limit_req_zone $binary_remote_addr zone=echo_pages:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=echo_api:10m rate=3r/s;
limit_req_zone $binary_remote_addr zone=echo_accounts:10m rate=5r/s;
limit_conn_zone $binary_remote_addr zone=echo_connections:10m;

server {
    listen 80;
    server_name echo.xhbtroy.cn update.echo.xhbtroy.cn api.echo.xhbtroy.cn email.xhbtroy.cn;
    location ^~ /.well-known/acme-challenge/ { root /var/www/echo-acme; }
    location / { return 308 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    server_name echo.xhbtroy.cn;
    ssl_certificate /etc/letsencrypt/live/echo.xhbtroy.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/echo.xhbtroy.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    client_max_body_size 1k;
    add_header Strict-Transport-Security "max-age=31536000" always;
    location ^~ /_protected_echo_beta/ {
        internal;
        alias /opt/echo/private-releases/;
        add_header Cache-Control "private, no-store" always;
        add_header X-Content-Type-Options nosniff always;
    }
    location = /api/account/me/sync {
        client_max_body_size 2m;
        limit_req zone=echo_accounts burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:9090/v1/me/sync;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 75s;
    }
    location = /api/account/me/profiles {
        client_max_body_size 2m;
        limit_req zone=echo_accounts burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:9090/v1/me/profiles;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 75s;
    }
    location ^~ /api/account/ {
        client_max_body_size 64k;
        limit_req zone=echo_accounts burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:9090/v1/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 75s;
    }
    location / {
        limit_req zone=echo_pages burst=30 nodelay;
        limit_req_status 429;
        limit_conn echo_connections 20;
        proxy_pass http://127.0.0.1:8088;
        proxy_set_header Host $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
    }
}

server {
    listen 443 ssl;
    server_name api.echo.xhbtroy.cn;
    ssl_certificate /etc/letsencrypt/live/echo.xhbtroy.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/echo.xhbtroy.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    client_max_body_size 64k;
    add_header Strict-Transport-Security "max-age=31536000" always;
    location ^~ /_protected_echo_beta/ {
        internal;
        alias /opt/echo/private-releases/;
        add_header Cache-Control "private, no-store" always;
        add_header X-Content-Type-Options nosniff always;
    }
    location = /v1/me/sync {
        client_max_body_size 2m;
        limit_req zone=echo_accounts burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:9090;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 75s;
    }
    location = /v1/me/profiles {
        client_max_body_size 2m;
        limit_req zone=echo_accounts burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:9090;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 75s;
    }
    location = /v1/echo/inference {
        client_max_body_size 2m;
        limit_req zone=echo_accounts burst=10 nodelay;
        limit_req_status 429;
        limit_conn echo_connections 5;
        proxy_pass http://127.0.0.1:9090;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
    }
    location /v1/ {
        limit_req zone=echo_accounts burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:9090;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 75s;
    }
    location = /healthz { proxy_pass http://127.0.0.1:9090; }
    location / { return 404; }
}

server {
    listen 443 ssl;
    server_name email.xhbtroy.cn;
    ssl_certificate /etc/letsencrypt/live/echo.xhbtroy.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/echo.xhbtroy.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    client_max_body_size 64k;
    add_header Strict-Transport-Security "max-age=31536000" always;
    location ^~ /api/account/ {
        limit_req zone=echo_accounts burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:9090/v1/;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 75s;
    }
    location = / { proxy_pass http://127.0.0.1:8088/mail; }
    location ~ ^/(style\.css|account\.css|account\.js|console\.css|console\.js|assets/logo\.png)$ {
        limit_req zone=echo_pages burst=20 nodelay;
        proxy_pass http://127.0.0.1:8088;
    }
    location / { return 404; }
}

server {
    listen 443 ssl;
    server_name update.echo.xhbtroy.cn;
    ssl_certificate /etc/letsencrypt/live/echo.xhbtroy.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/echo.xhbtroy.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    client_max_body_size 1k;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'; object-src 'none'" always;
    location = / { proxy_pass http://127.0.0.1:8088/updates; }
    location = /api/release { proxy_pass http://127.0.0.1:8088; }
    location = /style.css { proxy_pass http://127.0.0.1:8088; }
    location = /app.js { proxy_pass http://127.0.0.1:8088; }
    location = /assets/logo.png { proxy_pass http://127.0.0.1:8088; }
    location = /healthz { proxy_pass http://127.0.0.1:8787; }
    location = /v1/releases/stable/windows-x64 {
        limit_req zone=echo_api burst=15 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8787;
        proxy_read_timeout 10s;
    }
    location = /v2/releases/stable/windows-x64 {
        limit_req zone=echo_api burst=15 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8787;
    }
    location ~ ^/artifacts/(Echo-Setup-[0-9]+\.[0-9]+\.[0-9]+\.exe|Echo-Update-[0-9]+\.[0-9]+\.[0-9]+\.zip)$ {
        limit_conn echo_connections 4;
        proxy_pass http://127.0.0.1:8787;
        proxy_read_timeout 300s;
        proxy_buffering off;
    }
    location / { return 404; }
}
